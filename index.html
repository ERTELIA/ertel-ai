<style>
  :root{
    --ink:#E7ECF3;
    --muted:#8A96A8;
    --paper:#0A0E15;
    --paper-2:#141C2B;
    --panel:#121927;
    --line:rgba(255,255,255,.09);
    --steel:#3E8EE0;
    --steel-dark:#0A0F18;
    --amber:#E8A33D;
    --amber-dark:#B9791F;
    --brick:#EF5B5B;
    --moss:#34C77B;
    --white:#FFFFFF;
    --radius:10px;
    --font-display:'Barlow Condensed', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #app{width:100%;margin:0 auto;min-height:100vh;background:
      radial-gradient(ellipse at 85% 0%, rgba(62,142,224,.10), transparent 45%),
      radial-gradient(ellipse at 0% 100%, rgba(232,163,61,.06), transparent 45%),
      var(--paper);
    position:relative;padding-bottom:74px;}

  /* Top bar */
  .topbar{background:var(--steel-dark);color:var(--white);padding:16px 18px 14px;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(255,255,255,.06);}
  .topbar .brand{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .brand .tag{width:9px;height:9px;background:var(--amber);border-radius:2px;display:inline-block;box-shadow:0 0 8px rgba(232,163,61,.7);}
  .topbar .sub{font-size:12px;opacity:.6;margin-top:2px;font-family:var(--font-mono);letter-spacing:.5px;}
  .topbar .userchip{position:absolute;right:16px;top:16px;font-size:11px;font-family:var(--font-mono);opacity:.85;text-align:right;cursor:pointer;}

  /* Bottom nav (mobile) */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--steel-dark);display:flex;z-index:20;border-top:1px solid rgba(255,255,255,.08);}
  .nav button{flex:1;background:none;border:none;color:rgba(255,255,255,.4);font-family:var(--font-body);font-size:10.5px;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;letter-spacing:.3px;}
  .nav button.active{color:var(--amber);}
  .nav svg{width:20px;height:20px;}

  .view{padding:16px;}
  .hidden{display:none !important;}

  h2.section-title{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.5px;font-size:19px;margin:0 0 12px;color:var(--ink);display:flex;align-items:center;gap:8px;}
  h2.section-title::before{content:"";width:4px;height:16px;background:var(--amber);display:inline-block;box-shadow:0 0 6px rgba(232,163,61,.6);}

  /* Cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .tag-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0;margin-bottom:10px;overflow:hidden;position:relative;}
  .tag-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--steel);box-shadow:0 0 8px rgba(62,142,224,.5);}
  .tag-card.alert::before{background:var(--brick);box-shadow:0 0 8px rgba(239,91,91,.5);}
  .tag-card .inner{padding:12px 14px 12px 16px;}
  .tag-card .row1{display:flex;justify-content:space-between;align-items:baseline;}
  .tag-card .codigo{font-family:var(--font-mono);font-size:11px;color:#7FB4EE;background:rgba(62,142,224,.12);padding:2px 6px;border-radius:4px;letter-spacing:.5px;}
  .tag-card .desc{font-weight:600;font-size:14.5px;margin-top:5px;color:var(--ink);}
  .tag-card .meta{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .tag-card .qtd{font-weight:700;color:var(--ink);}
  .tag-card .qtd.low{color:var(--brick);}
  .pill{display:inline-block;font-size:10px;font-family:var(--font-mono);padding:2px 7px;border-radius:20px;letter-spacing:.4px;}
  .pill.A{background:rgba(52,199,123,.15);color:#4ADE80;}
  .pill.B{background:rgba(232,163,61,.18);color:#F0B44E;}
  .pill.C{background:rgba(239,91,91,.15);color:#F87171;}

  /* Metrics grid */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
  .metric{background:linear-gradient(160deg,#122036,#0B111C);border:1px solid rgba(62,142,224,.18);color:var(--white);border-radius:var(--radius);padding:14px;}
  .metric .val{font-family:var(--font-display);font-size:26px;font-weight:700;}
  .metric .lbl{font-size:10.5px;opacity:.65;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
  .metric.amber{background:linear-gradient(160deg,#3a2a10,#241a08);border-color:rgba(232,163,61,.25);}

  /* Grid de cartões (produtos, ativos, histórico etc.) — 1 coluna no celular, várias em telas maiores */
  .card-grid{display:block;}

  /* Forms */
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px;}
  input, select, textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--font-body);font-size:14.5px;background:var(--paper-2);color:var(--ink);}
  input::placeholder, textarea::placeholder{color:rgba(255,255,255,.3);}
  input:focus, select:focus, textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(62,142,224,.15);}
  input[type=number]{font-family:var(--font-mono);}
  select{color-scheme:dark;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border-radius:8px;border:none;font-weight:600;font-size:14.5px;cursor:pointer;font-family:var(--font-body);margin-top:14px;}
  .btn-primary{background:linear-gradient(180deg,#4C97E6,#2E6FBE);color:var(--white);box-shadow:0 4px 14px rgba(62,142,224,.28);}
  .btn-primary:active{background:var(--steel-dark);}
  .btn-amber{background:linear-gradient(180deg,#F0A83E,#D9791E);color:#1B1305;box-shadow:0 4px 14px rgba(217,121,30,.28);}
  .btn-outline{background:none;border:1.5px solid var(--steel);color:#7FB4EE;}
  .btn-ghost{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:linear-gradient(180deg,#F16A6A,#D64545);color:var(--white);}
  .btn-sm{padding:8px;font-size:12.5px;margin-top:8px;}
  .row-2{display:flex;gap:10px;}
  .row-2 > *{flex:1;}

  .search{display:flex;gap:8px;margin-bottom:12px;}
  .search input{flex:1;}
  .tabs-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tabs-wrap button{flex:0 0 auto;width:auto;margin-top:0;padding:8px 13px;}
  .barchart-row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .barchart-label{width:118px;font-size:11px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .barchart-track{flex:1;background:var(--paper-2);border-radius:4px;height:18px;position:relative;overflow:hidden;}
  .barchart-fill{height:100%;background:linear-gradient(90deg,#2E6FBE,#4C97E6);border-radius:4px;}
  .barchart-value{width:60px;text-align:right;font-family:var(--font-mono);font-size:11px;flex-shrink:0;}

  .empty{text-align:center;padding:40px 16px;color:var(--muted);}
  .empty .icon{font-size:34px;margin-bottom:8px;}

  /* Login */
  .login-wrap{min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:36px 24px;
    background:
      radial-gradient(ellipse at 78% 12%, rgba(70,140,220,.30), transparent 55%),
      radial-gradient(ellipse at 90% 75%, rgba(232,163,61,.12), transparent 55%),
      linear-gradient(180deg,#080B10 0%,#0C121C 55%,#080B10 100%);
  }
  .login-wrap::before{content:"";position:absolute;inset:0;pointer-events:none;

<div id="app"></div>

<script>
/* ============ PONTE PARA O BANCO DE DADOS (Neon via /api/storage) ============
   Fora do Claude, window.storage não existe. Este bloco recria a mesma
   assinatura (get/set/delete/list) usada em todo o app:
   - shared=false (dado pessoal, ex: "lembrar login") -> fica no navegador (localStorage)
   - shared=true  (dado da empresa, ex: produtos/retiradas) -> vai para a API -> Neon
*/
window.storage = {
  async _readErr(r){
    try{ const j = await r.json(); return j.error || r.statusText || ('HTTP '+r.status); }
    catch(e){ return r.statusText || ('HTTP '+r.status); }
  },
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem(key);
      if(v===null) throw new Error('not found');
      return {key, value:v, shared:false};
    }
    const r = await fetch('/api/storage?key='+encodeURIComponent(key));
    if(r.status===404) throw new Error('not found');
    if(!r.ok) throw new Error(await this._readErr(r));
    const data = await r.json();
    return {key:data.key, value:data.value, shared:true};
  },
  async set(key, value, shared){
    if(!shared){ localStorage.setItem(key, value); return {key, value, shared:false}; }
    const r = await fetch('/api/storage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key, value})
    });
    if(!r.ok) throw new Error(await this._readErr(r));
    const data = await r.json();
    return {key:data.key, value:data.value, shared:true};
  },
  async delete(key, shared){
    if(!shared){ localStorage.removeItem(key); return {key, deleted:true, shared:false}; }
    const r = await fetch('/api/storage?key='+encodeURIComponent(key), {method:'DELETE'});
    if(!r.ok) throw new Error(await this._readErr(r));
    return {key, deleted:true, shared:true};
  },
  async list(prefix, shared){
    if(!shared){
      const keys = Object.keys(localStorage).filter(k=>k.startsWith(prefix||''));
      return {keys, prefix, shared:false};
    }
    const r = await fetch('/api/storage?prefix='+encodeURIComponent(prefix||''));
    if(!r.ok) throw new Error(await this._readErr(r));
    const data = await r.json();
    return {keys:data.keys, prefix, shared:true};
  }
};

/* ============ STORAGE HELPERS ============ */
const KEYS = { produtos:'ertel:produtos', retiradas:'ertel:retiradas', centros:'ertel:centros', usuarios:'ertel:usuarios', config:'ertel:config', produtosLub:'ertel:produtosLub', retiradasLub:'ertel:retiradasLub', ativos:'ertel:ativos', ativosRG:'ertel:ativosRG' };

let dbOffline = false;
function showDbErrorBanner(msg){
  dbOffline = true;
  let b = document.getElementById('dbErrorBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'dbErrorBanner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#B33F3F;color:#fff;padding:10px 14px;font-size:12.5px;z-index:999;text-align:center;font-family:sans-serif;';
    document.body.prepend(b);
  }
  b.textContent = '⚠️ Sem conexão com o banco de dados — os dados NÃO estão sendo salvos. Detalhe: ' + msg;
}
function clearDbErrorBanner(){
  dbOffline = false;
  const b = document.getElementById('dbErrorBanner');
  if(b) b.remove();
}

async function loadAll(key, fallback){
  try{
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout ao contatar /api/storage')), 8000));
    const r = await Promise.race([window.storage.get(key, true), timeout]);
    clearDbErrorBanner();
    return r && r.value ? JSON.parse(r.value) : fallback;
  }catch(e){
    if(String(e.message||e).includes('not found')){ clearDbErrorBanner(); }
    else { showDbErrorBanner(String(e.message||e)); }
    return fallback;
  }
}
async function saveAll(key, value){
  try{
    await window.storage.set(key, JSON.stringify(value), true);
    clearDbErrorBanner();
  }catch(e){
    console.error('storage error', e);
    showDbErrorBanner(String(e.message||e));
    toast('Erro ao salvar no banco — os dados não foram gravados. Veja o aviso no topo da tela.');
  }
}

let DB = { produtos:[], retiradas:[], centros:[], usuarios:[], config:{whatsappResumo:''}, produtosLub:[], retiradasLub:[], ativos:[], ativosRG:[] };
let currentUser = null; // {id, nome, perfil}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function today(){ return new Date(); }
function sameMonth(d, ref){ const a=new Date(d); return a.getMonth()===ref.getMonth() && a.getFullYear()===ref.getFullYear(); }

async function bootstrap(){
  DB.produtos = await loadAll(KEYS.produtos, []);
  DB.retiradas = await loadAll(KEYS.retiradas, []);
  DB.centros = await loadAll(KEYS.centros, []);
  DB.usuarios = await loadAll(KEYS.usuarios, []);
  DB.config = await loadAll(KEYS.config, {whatsappResumo:''});
  DB.produtosLub = await loadAll(KEYS.produtosLub, []);
  DB.retiradasLub = await loadAll(KEYS.retiradasLub, []);
  DB.ativos = await loadAll(KEYS.ativos, []);
  DB.ativosRG = await loadAll(KEYS.ativosRG, []);
  if(!DB.usuarios.some(u=>u.master===true)){
    DB.usuarios.push({id:uid(), nome:'Administrador Master', login:'1234', senha:'1234', perfil:'admin', master:true, ativo:true});
    await saveAll(KEYS.usuarios, DB.usuarios);
  }
  try{
    const savedId = localStorage.getItem('ertel:session');
    if(savedId){
      const u = DB.usuarios.find(x=>x.id===savedId && x.ativo!==false);
      if(u){ currentUser = {id:u.id, nome:u.nome, perfil:u.perfil}; }
      else { localStorage.removeItem('ertel:session'); }
    }
  }catch(e){}
  render();
}
function isMaster(){
  const u = DB.usuarios.find(x=>x.id===(currentUser&&currentUser.id));
  return !!(u && u.master===true);
}
function isAdminLevel(){
  const u = DB.usuarios.find(x=>x.id===(currentUser&&currentUser.id));
  return !!(u && (u.master===true || u.adminLevel===true));
}
function roleLabel(){
  const u = DB.usuarios.find(x=>x.id===(currentUser&&currentUser.id));
  if(u && u.master) return 'master';
  if(u && u.adminLevel) return 'adm';
  return 'usuário';
}

  t.className='toast'; t.textContent=msg;

}

/* ============ ROOT RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(!currentUser){ app.innerHTML = loginScreen(); attachLoginEvents(); return; }
  if(!moduloAtivo){
    const uAtual = DB.usuarios.find(x=>x.id===currentUser.id);
    const podeMro = usuarioTemAcessoModulo(uAtual, 'mro');
    const podeLub = usuarioTemAcessoModulo(uAtual, 'lub');
    const podeAtivos = usuarioTemAcessoModulo(uAtual, 'ativos');
    if(!uAtual || !uAtual.master){
      const permitidos = [podeMro&&'mro', podeLub&&'lub', podeAtivos&&'ativos'].filter(Boolean);
      if(permitidos.length===1){ moduloAtivo=permitidos[0]; resetModuleUiState(); }
    }
  }
  if(!moduloAtivo){ app.innerHTML = moduloSelectorScreen(); attachModuloSelectorEvents(); return; }
  const uAtualTop = DB.usuarios.find(x=>x.id===currentUser.id);
  const modulosDoUsuario = uAtualTop && uAtualTop.master ? ['mro','lub','ativos'] : ['mro','lub','ativos'].filter(m=>usuarioTemAcessoModulo(uAtualTop, m));
  const temMaisDeUmModulo = modulosDoUsuario.length > 1;
  const rotulo = moduloAtivo==='lub' ? 'Sala de Lubrificantes' : (moduloAtivo==='ativos' ? 'Cadastro de Ativos' : 'Estoque MRO');
  const rotuloProdutos = moduloAtivo==='lub' ? 'Lubri' : 'Produtos';
  const navButtons = moduloAtivo==='ativos'
    ? `<button data-v="dashboard"><span>${ICONS.home}</span>Início</button>
       <button data-v="produtos"><span>${ICONS.box}</span>Ativos</button>
       <button data-v="mais"><span>${ICONS.more}</span>Mais</button>`
    : `<button data-v="dashboard"><span>${ICONS.home}</span>Início</button>
       <button data-v="produtos"><span>${ICONS.box}</span>${rotuloProdutos}</button>
       <button data-v="retirada"><span>${ICONS.out}</span>Retirar</button>
       <button data-v="historico"><span>${ICONS.hist}</span>Histórico</button>
       <button data-v="mais"><span>${ICONS.more}</span>Mais</button>`;
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="tag"></span>ERTEL</div>
      <div class="sub">${rotulo}${temMaisDeUmModulo?` · <button class="link-btn" id="trocarModuloBtn" style="color:inherit;opacity:.85">trocar módulo</button>`:''}</div>
      <div class="userchip" id="logoutBtn">${currentUser.nome}<br>(${roleLabel()}) · sair</div>
    </div>
    <div class="view" id="viewArea"></div>
    <div class="nav">
      ${navButtons}
    </div>
  `;
  document.getElementById('logoutBtn').onclick = ()=>{ currentUser=null; moduloAtivo=null; try{localStorage.removeItem('ertel:session');}catch(e){} render(); };
  const trocarBtn = document.getElementById('trocarModuloBtn');
  if(trocarBtn) trocarBtn.onclick = (e)=>{ e.stopPropagation(); moduloAtivo=null; currentView='dashboard'; render(); };
  document.querySelectorAll('.nav button').forEach(b=>{
    b.onclick = ()=>{ currentView=b.dataset.v; render(); };
    if(b.dataset.v===currentView) b.classList.add('active');
  });
  renderView();
}

function usuarioTemAcessoModulo(u, modulo){
  if(!u) return false;
  if(u.master) return true;
  if(!u.modulos || !Array.isArray(u.modulos)) return true; // usuários antigos sem essa config: mantém acesso a tudo
  return u.modulos.includes(modulo);
}

function renderView(){
  const el = document.getElementById('viewArea');
  if(moduloAtivo==='ativos'){
    if(currentView==='dashboard') el.innerHTML = ativosDashboardView();
    else if(currentView==='produtos') { el.innerHTML = ativosListView(); attachAtivosEvents(); return; }

function ativoCompletudePct(a){
  let preenchidos = 0;
  CAMPOS_COMPLETUDE_ATIVO.forEach(f=>{ if(a[f] && String(a[f]).trim()!=='') preenchidos++; });
  const especificos = (a.tipo && TIPO_CAMPOS_ESPECIFICOS[a.tipo]) ? TIPO_CAMPOS_ESPECIFICOS[a.tipo] : [];
  const campos = a.campos || {};
  especificos.forEach(f=>{ if(campos[f.id] && String(campos[f.id]).trim()!=='') preenchidos++; });
  const total = CAMPOS_COMPLETUDE_ATIVO.length + especificos.length;
  return total>0 ? Math.round((preenchidos/total)*100) : 0;
}

function proximoNumeroRGMotor(){
  let max = 0;
  DB.ativosRG.forEach(rg=>{
    if(rg.tipo==='Motor' && /^M\d+$/i.test(rg.numeroRG||'')){
      const n = parseInt(rg.numeroRG.slice(1),10);
      if(!isNaN(n) && n>max) max = n;
    }
  });
  return 'M' + String(max+1).padStart(4,'0');
}

// RG automático para equipamentos reserva (motoredutor/redutor/bomba/outros): E0001..E9999,
// e ao esgotar 9999 volta pra E0001-01, E0002-01... (novo ciclo com sufixo -01, -02...).
function proximoNumeroRGEquipamento(){
  let maxCiclo = 0, maxSeqNoCiclo = 0;
  DB.ativosRG.forEach(rg=>{
    if(rg.tipo==='Motor') return;
    const m = /^E(\d{4})(?:-(\d{2}))?$/i.exec(rg.numeroRG||'');
    if(!m) return;
    const seq = parseInt(m[1],10);
    const ciclo = m[2] ? parseInt(m[2],10) : 0;
    if(ciclo>maxCiclo || (ciclo===maxCiclo && seq>maxSeqNoCiclo)){ maxCiclo=ciclo; maxSeqNoCiclo=seq; }
  });
  let seq = maxSeqNoCiclo + 1, ciclo = maxCiclo;
  if(seq>9999){ seq=1; ciclo=maxCiclo+1; }
  const seqStr = String(seq).padStart(4,'0');
  return ciclo===0 ? ('E'+seqStr) : ('E'+seqStr+'-'+String(ciclo).padStart(2,'0'));
}

/* ---- Métricas de manutenção do motor (consertos, custo, MTBF) ---- */
function motorQtdConsertos(m){ return (m.consertos||[]).length; }

function motorCustoTotalConserto(m){
  return (m.consertos||[]).reduce((s,c)=>s + (Number(c.valor)||0), 0);
}

function formataMoeda(v){
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// MTBF (Tempo Médio Entre Falhas), em dias — média do intervalo entre os envios para
// conserto, a partir do primeiro registro. Precisa de pelo menos 2 registros de conserto.
function motorMTBFDias(m){
  const envios = (m.consertos||[])
    .map(c=>new Date(c.dataEnvio).getTime())
    .filter(t=>!isNaN(t))
    .sort((a,b)=>a-b);
  if(envios.length<2) return null;
  const totalMs = envios[envios.length-1] - envios[0];
  const intervalos = envios.length - 1;
  return Math.round((totalMs/intervalos) / (1000*60*60*24));
}

function motorConsertoAberto(m){
  return (m.consertos||[]).find(c=>!c.dataRetorno) || null;
}

/* ---- Movimentação de RG de motor entre Sala de Motores e um TAG existente ---- */
function movimentarRGParaAtivo(motorId, destinoAtivo){
  const novo = DB.ativosRG.find(r=>r.id===motorId);
  if(!novo || !destinoAtivo) return;

  // Se este motor já estava instalado em outro TAG, libera o TAG antigo dele.
  if(novo.ativoId && novo.ativoId!==destinoAtivo.id){
    const tagAntigo = DB.ativos.find(a=>a.id===novo.ativoId);
    if(tagAntigo && tagAntigo.motorInstaladoId===novo.id) tagAntigo.motorInstaladoId = null;
  }

  const antigoMotorId = destinoAtivo.motorInstaladoId;
  if(antigoMotorId && antigoMotorId!==novo.id){
    const antigo = DB.ativosRG.find(r=>r.id===antigoMotorId);
    if(antigo){
      antigo.status = 'atencao';
      antigo.ativoId = null;
      if(antigo.historico && antigo.historico.length>0){
        const ultimo = antigo.historico[antigo.historico.length-1];
        if(!ultimo.dataSaida) ultimo.dataSaida = new Date().toISOString();
      }
    }
  }
  novo.status = 'instalado';
  novo.ativoId = destinoAtivo.id;
  if(!novo.historico) novo.historico = [];
  novo.historico.push({ativoId:destinoAtivo.id, ativoCodigo:destinoAtivo.codigo, dataEntrada:new Date().toISOString(), dataSaida:null});
  destinoAtivo.motorInstaladoId = novo.id;
  destinoAtivo.tipo = 'Motor';
  destinoAtivo.fabricante = novo.fabricante||'';
  destinoAtivo.modelo = novo.modelo||'';
  destinoAtivo.numeroSerie = novo.numeroSerie||'';
  destinoAtivo.placaIdentificacao = novo.placaIdentificacao||'';
  destinoAtivo.campos = {...(novo.campos||{})};
}

/* ---- Cadastro de Motores (RG automático) ---- */
function initMotorFormDraft(base){
  return {
    nome: base.nome||'', fabricante: base.fabricante||'', modelo: base.modelo||'',
    numeroSerie: base.numeroSerie||'', placaIdentificacao: base.placaIdentificacao||'',
    localizacao: base.localizacao||'Sala de Motores', observacoes: base.observacoes||'',
    foto: base.foto||'', campos: {...(base.campos||{})}
  };
}

function captureMotorFormValues(){
  if(!motorFormDraft) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if(g('mNome')!==undefined) motorFormDraft.nome = g('mNome').trim();
  if(g('mFabricante')!==undefined) motorFormDraft.fabricante = g('mFabricante').trim();
  if(g('mModelo')!==undefined) motorFormDraft.modelo = g('mModelo').trim();
  if(g('mNumeroSerie')!==undefined) motorFormDraft.numeroSerie = g('mNumeroSerie').trim();
  if(g('mPlaca')!==undefined) motorFormDraft.placaIdentificacao = g('mPlaca').trim();
  if(g('mLocalizacao')!==undefined) motorFormDraft.localizacao = g('mLocalizacao').trim();
  if(g('mObservacoes')!==undefined) motorFormDraft.observacoes = g('mObservacoes').trim();
  MOTOR_FIELDS.forEach(f=>{ const v = g('mcampo-'+f.id); if(v!==undefined) motorFormDraft.campos[f.id] = v.trim(); });
}

  });

  document.querySelectorAll('.addFilhoAtivo').forEach(b=>{
    b.onclick = ()=>{ editingAtivo=null; prefillAtivoPaiId=b.dataset.id; ativoFormDraft=null; pendingFotoAtivoDataUrl=''; pendingFoto2AtivoDataUrl=''; showAtivoForm=true; renderView(); };
  });

  document.querySelectorAll('.pecasAtivoBtn').forEach(b=>{
    b.onclick = ()=>{ pecasAtivoId=b.dataset.id; editingPeca=null; showPecaForm=false; renderView(); };
  });

  document.querySelectorAll('.pdfAtivoBtn').forEach(b=>{
    b.onclick = ()=>{ exportAtivoPdf(b.dataset.id); };
  });

  const closePecasBtn = document.getElementById('closePecasSheet');
  if(closePecasBtn) closePecasBtn.onclick = ()=>{ pecasAtivoId=null; editingPeca=null; showPecaForm=false; renderView(); };

  const novaPecaBtn = document.getElementById('novaPecaBtn');
  if(novaPecaBtn) novaPecaBtn.onclick = ()=>{ editingPeca=null; showPecaForm=true; renderView(); };

  const cancelPecaBtn = document.getElementById('cancelPecaBtn');
  if(cancelPecaBtn) cancelPecaBtn.onclick = ()=>{ editingPeca=null; showPecaForm=false; renderView(); };

  document.querySelectorAll('.editPecaBtn').forEach(b=>{
    b.onclick = ()=>{
      const ativo = DB.ativos.find(a=>a.id===pecasAtivoId);
      editingPeca = ativo.pecas.find(pc=>pc.id===b.dataset.id);
      showPecaForm=true; renderView();
    };
  });

  document.querySelectorAll('.deletePecaBtn').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Excluir esta peça definitivamente?')) return;
      const ativo = DB.ativos.find(a=>a.id===pecasAtivoId);
      ativo.pecas = (ativo.pecas||[]).filter(pc=>pc.id!==b.dataset.id);
      await saveAll(KEYS.ativos, DB.ativos);
      toast('Peça excluída'); renderView();
    };
  });

  const savePecaBtn = document.getElementById('savePecaBtn');
  if(savePecaBtn) savePecaBtn.onclick = async ()=>{
    const ativo = DB.ativos.find(a=>a.id===pecasAtivoId);
    const descricao = document.getElementById('pcDescricao').value.trim();
    if(!descricao){ toast('Preencha ao menos a descrição da peça'); return; }
    const dadosPeca = {
      tipoMaterial: document.getElementById('pcTipoMaterial').value.trim(),
      descricao,
      codigoFabricante: document.getElementById('pcCodigoFabricante').value.trim(),
      codigoEstoque: document.getElementById('pcCodigoEstoque').value.trim(),
      quantidade: parseFloat(document.getElementById('pcQuantidade').value)||0,
      dimensoes: document.getElementById('pcDimensoes').value.trim(),
      existeCadastro: document.getElementById('pcExisteCadastro').value,
      statusEstoque: document.getElementById('pcStatusEstoque').value
    };
    if(!ativo.pecas) ativo.pecas = [];
    if(editingPeca){ Object.assign(editingPeca, dadosPeca); }
    else { ativo.pecas.push({id:uid(), ...dadosPeca}); }
    await saveAll(KEYS.ativos, DB.ativos);
    editingPeca=null; showPecaForm=false; toast('Peça salva'); renderView();
  };

  const exportPecasBtn = document.getElementById('exportPecasBtn');
  if(exportPecasBtn) exportPecasBtn.onclick = ()=>{ exportPecasXlsx(pecasAtivoId); };

  const closeBtn = document.getElementById('closeAtivoForm');
  if(closeBtn) closeBtn.onclick = ()=>{ showAtivoForm=false; prefillAtivoPaiId=''; ativoFormDraft=null; pendingFotoAtivoDataUrl=''; pendingFoto2AtivoDataUrl=''; renderView(); };

  const tipoSelect = document.getElementById('aTipo');
  if(tipoSelect) tipoSelect.onchange = ()=>{
    captureAtivoFormValues();
    ativoFormDraft.tipo = tipoSelect.value;
    renderView();
  };

  document.querySelectorAll('.quickFillBtn').forEach(b=>{
    b.onclick = ()=>{ const f = document.getElementById(b.dataset.field); if(f) f.value = b.dataset.value; };
  });

  function wireFotoInput(inputId, onResult){
    const el = document.getElementById(inputId);
    if(!el) return;
    el.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxSize = 360;
          let w = img.width, h = img.height;
          if(w>h && w>maxSize){ h = h*(maxSize/w); w = maxSize; }
          else if(h>=w && h>maxSize){ w = w*(maxSize/h); h = maxSize; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          onResult(canvas.toDataURL('image/jpeg', 0.7));
          captureAtivoFormValues();
          renderView();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  }
  wireFotoInput('aFoto', (url)=>{ pendingFotoAtivoDataUrl = url; });
  wireFotoInput('aFoto2', (url)=>{ pendingFoto2AtivoDataUrl = url; });

  const paiSelect = document.getElementById('aAtivoPai');
  if(paiSelect) paiSelect.onchange = ()=>{
    const note = document.getElementById('salaMotoresNote');
    if(note) note.style.display = (paiSelect.value===SALA_MOTORES) ? '' : 'none';
    const rgNote = document.getElementById('rgVinculadoNote');
    if(rgNote){
      if(paiSelect.value && paiSelect.value!==SALA_MOTORES){
        const paiAtivo = DB.ativos.find(x=>x.id===paiSelect.value);
        const rgs = paiAtivo ? DB.ativosRG.filter(rg=>rg.localizacao && rg.localizacao.toLowerCase().includes(paiAtivo.codigo.toLowerCase())) : [];
        if(rgs.length>0){
          rgNote.style.display = '';
          rgNote.innerHTML = 'Este TAG tem RG reserva associado: ' + rgs.map(rg=>`<b>${rg.numeroRG}</b> (${rg.nome})`).join(', ');
        } else { rgNote.style.display = 'none'; }
      } else { rgNote.style.display = 'none'; }
    }
  };

  const saveBtn = document.getElementById('saveAtivoBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    captureAtivoFormValues();
    const codigo = ativoFormDraft.codigo;
    const nome = ativoFormDraft.nome;
    if(!nome){ toast('Preencha ao menos o nome'); return; }

    if(ativoFormDraft.ativoPaiId === SALA_MOTORES){
      const numeroRG = prompt('Número do RG deste equipamento reserva:');
      if(!numeroRG || !numeroRG.trim()){ toast('Cadastro cancelado — número de RG é obrigatório'); return; }
      const tipoRG = TIPOS_RG.includes(ativoFormDraft.tipo) ? ativoFormDraft.tipo : 'Outros';
      DB.ativosRG.push({
        id:uid(), tipo:tipoRG, descricaoOutros: tipoRG==='Outros' ? (ativoFormDraft.tipo||nome) : '',
        nome, numeroRG:numeroRG.trim(), localizacao: ativoFormDraft.localizacao || 'Sala de Motores',
        fabricante: ativoFormDraft.fabricante, modelo: ativoFormDraft.modelo, numeroSerie: ativoFormDraft.numeroSerie,
        dataCadastro:new Date().toISOString()
      });
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      showAtivoForm=false; editingAtivo=null; prefillAtivoPaiId=''; ativoFormDraft=null; pendingFotoAtivoDataUrl=''; pendingFoto2AtivoDataUrl='';
      toast('Cadastrado na Sala de Motores (RG) — consulte em Mais → Sala de Motores'); renderView();
      return;
    }

    if(!codigo){ toast('Preencha o código'); return; }
    if(DB.ativos.some(a=>a.codigo.toLowerCase()===codigo.toLowerCase() && (!editingAtivo || a.id!==editingAtivo.id))){
      toast('Já existe um ativo cadastrado com esse código'); return;
    }
    const dados = {
      codigo, nome,
      tipo: ativoFormDraft.tipo,
      ativoPaiId: ativoFormDraft.ativoPaiId,
      fabricante: ativoFormDraft.fabricante,
      modelo: ativoFormDraft.modelo,
      numeroSerie: ativoFormDraft.numeroSerie,
      placaIdentificacao: ativoFormDraft.placaIdentificacao,
      localizacao: ativoFormDraft.localizacao,
      criticidade: ativoFormDraft.criticidade,
      observacoes: ativoFormDraft.observacoes,
      campos: {...ativoFormDraft.campos},
      foto: pendingFotoAtivoDataUrl || (editingAtivo ? editingAtivo.foto : '') || '',
      foto2: pendingFoto2AtivoDataUrl || (editingAtivo ? editingAtivo.foto2 : '') || ''
    };
    if(editingAtivo){ Object.assign(editingAtivo, dados); }
    else { DB.ativos.push({id:uid(), ...dados, ativo:true, dataCadastro:new Date().toISOString()}); }
    await saveAll(KEYS.ativos, DB.ativos);
    showAtivoForm=false; editingAtivo=null; prefillAtivoPaiId=''; ativoFormDraft=null; pendingFotoAtivoDataUrl=''; pendingFoto2AtivoDataUrl=''; toast('Ativo salvo'); renderView();
  };

  const deactivateBtn = document.getElementById('deactivateAtivoBtn');
  if(deactivateBtn) deactivateBtn.onclick = async ()=>{
    editingAtivo.ativo = editingAtivo.ativo===false;
    await saveAll(KEYS.ativos, DB.ativos);
    const msg = editingAtivo.ativo===false ? 'Ativo desativado' : 'Ativo reativado';
    showAtivoForm=false; editingAtivo=null; ativoFormDraft=null; toast(msg); renderView();
  };

  const deleteBtn = document.getElementById('deleteAtivoBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    if(!confirm(`Excluir "${editingAtivo.nome}" definitivamente? Essa ação não pode ser desfeita.`)) return;
    DB.ativos = DB.ativos.filter(a=>a.id!==editingAtivo.id);
    await saveAll(KEYS.ativos, DB.ativos);
    showAtivoForm=false; editingAtivo=null; ativoFormDraft=null; toast('Ativo excluído'); renderView();
  };
}

function salaMotoresSection(){
  const motores = DB.ativosRG.filter(rg=>rg.tipo==='Motor');
  const outrosRG = DB.ativosRG.filter(rg=>rg.tipo!=='Motor');
  const motoresReserva = motores.filter(m=>m.status==='reserva' || m.status==='atencao');
  const motoresInstalados = motores.filter(m=>m.status==='instalado');
  const motoresConserto = motores.filter(m=>m.status==='conserto' || m.status==='descarte');

  const busca = salaMotoresBusca.trim().toLowerCase();
  const bate = rg => !busca || [rg.nome, rg.modelo, rg.fabricante, rg.numeroRG].some(v=>(v||'').toLowerCase().includes(busca));

  let html = `<div class="tabs-wrap">

    if(motorConsertoRetornoId) html += consertoRetornoSheet();

      <div class="row1"><span class="codigo">${rg.numeroRG}</span><span class="qtd" style="font-size:12px">${rg.tipo==='Outros'?(rg.descricaoOutros||'Outros'):rg.tipo}</span></div>
      <div class="desc">${rg.nome}</div>
      <div class="meta"><span>📍 ${rg.localizacao}</span><span></span></div>
      ${rg.fabricante||rg.modelo?`<div class="note">${rg.fabricante||''} ${rg.modelo?'· '+rg.modelo:''}</div>`:''}
      <button class="btn btn-danger btn-sm deleteRGBtn" data-id="${rg.id}" style="margin-top:8px">Excluir</button>
    </div></div>`;
  });
  html += `</div>`;
  return html;
}

function motorCard(m){
  const statusLabel = STATUS_MOTOR[m.status] || m.status;
  const corPill = m.status==='instalado' ? 'A' : (m.status==='atencao' ? 'B' : (m.status==='conserto' ? 'C' : ''));
  const instaladoEm = m.ativoId ? DB.ativos.find(a=>a.id===m.ativoId) : null;
  const qtdConsertos = motorQtdConsertos(m);
  const custoTotal = motorCustoTotalConserto(m);
  const mtbf = motorMTBFDias(m);
  const consertoAberto = motorConsertoAberto(m);

  return `<div class="tag-card ${m.status==='atencao'?'alert':''}"><div class="inner">
      <div class="row1"><span class="codigo">${m.numeroRG}</span><span class="pill ${corPill}">${statusLabel}</span></div>
      <div class="desc">${m.nome}</div>
      ${m.fabricante||m.modelo?`<div class="note">${m.fabricante||''} ${m.modelo?'· '+m.modelo:''}</div>`:''}
      ${instaladoEm?`<div class="meta"><span>📍 Instalado em: ${instaladoEm.codigo} — ${instaladoEm.nome}</span><span></span></div>`:`<div class="meta"><span>📍 ${m.localizacao||'Sala de Motores'}</span><span></span></div>`}
      <div class="meta"><span>Movimentado ${(m.historico||[]).length}x</span><span></span></div>
      ${qtdConsertos>0?`<div class="meta"><span>🔧 ${qtdConsertos} conserto${qtdConsertos>1?'s':''}</span><span>${formataMoeda(custoTotal)}</span></div>`:''}
      ${mtbf!==null?`<div class="meta"><span>MTBF</span><span>${mtbf} dia${mtbf!==1?'s':''}</span></div>`:''}

      ${m.status==='atencao'?`<div class="note" style="color:var(--brick)">Este RG saiu de um TAG e precisa de uma decisão.</div>
      <div class="row-2" style="margin-top:8px">
        <button class="btn btn-outline btn-sm motorEnviarConsertoBtn" data-id="${m.id}">Conserto</button>
        <button class="btn btn-outline btn-sm motorStatusBtn" data-id="${m.id}" data-status="descarte">Descarte</button>
      </div>
      <button class="btn btn-ghost btn-sm motorStatusBtn" data-id="${m.id}" data-status="reserva" style="margin-top:8px">Manter na Sala de Motores</button>`:''}

      ${m.status==='conserto'?`<div class="note" style="color:var(--amber)">Aguardando retorno${consertoAberto&&consertoAberto.fornecedor?' — Fornecedor: '+consertoAberto.fornecedor:''}${consertoAberto&&consertoAberto.nf?' — NF: '+consertoAberto.nf:''}${consertoAberto&&consertoAberto.dataEnvio?' (enviado em '+new Date(consertoAberto.dataEnvio+'T00:00:00').toLocaleDateString('pt-BR')+')':''}</div>
      <button class="btn btn-primary btn-sm motorRegistrarRetornoBtn" data-id="${m.id}" style="margin-top:8px">Registrar retorno</button>`:''}

      ${m.status==='descarte'?`<div class="note" style="color:var(--brick)">Motor descartado.</div>
      <button class="btn btn-outline btn-sm motorStatusBtn" data-id="${m.id}" data-status="reserva" style="margin-top:8px">Reativar (voltar para reserva)</button>`:''}

      <div class="row-2" style="margin-top:8px">
        ${(m.status==='reserva'||m.status==='instalado')?`<button class="btn btn-amber btn-sm motorMoveBtn" data-id="${m.id}">🔁 Movimentar</button>`:''}
        <button class="btn btn-outline btn-sm motorHistoricoBtn" data-id="${m.id}">📋 Histórico</button>
      </div>
      <div class="row-2" style="margin-top:8px">
        <button class="btn btn-ghost btn-sm editMotorBtn" data-id="${m.id}">Editar</button>
        <button class="btn btn-danger btn-sm deleteMotorBtn" data-id="${m.id}">Excluir</button>
      </div>
    </div></div>`;
}

/* ---- Histórico completo do RG: movimentações de TAG + consertos, com totais ---- */
function historicoSheet(){
  const m = DB.ativosRG.find(r=>r.id===motorHistoricoId);
  if(!m) return '';
  const movimentacoes = (m.historico||[]).slice().reverse();
  const consertos = (m.consertos||[]).slice().reverse();
  const custoTotal = motorCustoTotalConserto(m);
  const mtbf = motorMTBFDias(m);
  const fmtData = d => d ? new Date(d+ (d.length<=10?'T00:00:00':'')).toLocaleDateString('pt-BR') : '—';

  return `
  <div class="overlay" id="historicoOverlay"><div class="sheet">
    <div class="sheet-head"><h2 class="section-title" style="margin:0">Histórico — ${m.numeroRG}</h2><button class="close" id="closeHistorico">×</button></div>

    <div class="metrics">
      <div class="metric"><div class="val">${movimentacoes.length}</div><div class="lbl">Movimentações</div></div>
      <div class="metric amber"><div class="val">${consertos.length}</div><div class="lbl">Consertos</div></div>
    </div>
    <div class="metrics">
      <div class="metric amber"><div class="val" style="font-size:20px">${formataMoeda(custoTotal)}</div><div class="lbl">Custo total em manutenção</div></div>
      ${mtbf!==null?`<div class="metric"><div class="val">${mtbf}</div><div class="lbl">MTBF (dias)</div></div>`:''}
    </div>

    <h2 class="section-title" style="font-size:14px;margin-top:16px">Movimentações entre TAGs</h2>
    ${movimentacoes.length===0?`<div class="note">Nenhuma movimentação registrada.</div>`:movimentacoes.map(h=>`
      <div class="tag-card"><div class="inner">
        <div class="row1"><span class="codigo">${h.ativoCodigo||'—'}</span><span></span></div>
        <div class="meta"><span>Entrada: ${fmtData(h.dataEntrada)}</span><span>Saída: ${h.dataSaida?fmtData(h.dataSaida):'em andamento'}</span></div>
      </div></div>`).join('')}

    <h2 class="section-title" style="font-size:14px;margin-top:16px">Consertos <span style="color:var(--amber)">— total ${formataMoeda(custoTotal)}</span></h2>
    ${consertos.length===0?`<div class="note">Nenhum conserto registrado.</div>`:consertos.map(c=>`
      <div class="tag-card"><div class="inner">
        <div class="row1"><span class="codigo">${c.fornecedor||'—'}</span><span class="qtd">${c.valor!=null?formataMoeda(c.valor):'em aberto'}</span></div>
        ${c.nf?`<div class="note">NF de remessa: ${c.nf}</div>`:''}
        ${c.orcamento?`<div class="note">Orçamento: ${c.orcamento}</div>`:''}
        <div class="meta"><span>Envio: ${fmtData(c.dataEnvio)}</span><span>Retorno: ${c.dataRetorno?fmtData(c.dataRetorno):'aguardando'}</span></div>
      </div></div>`).join('')}
  </div></div>`;
}

/* ---- Movimentar RG de motor para um ativo (TAG) já cadastrado ---- */

  return `

    <button class="btn btn-primary" id="confirmMotorMoveBtn">Confirmar movimentação</button>

}

function attachAtivosMaisEvents(){
  const tImp = document.getElementById('tabAtivosImportar'); if(tImp) tImp.onclick = ()=>{ ativosMaisTab='importar'; renderView(); };
  const tSala = document.getElementById('tabSalaMotores'); if(tSala) tSala.onclick = ()=>{ ativosMaisTab='salamotores'; renderView(); };

  if(ativosMaisTab==='salamotores'){
    const tEquip = document.getElementById('tabEquipReserva'); if(tEquip) tEquip.onclick = ()=>{ salaMotoresTab='equipamentos'; salaMotoresBusca=''; renderView(); };
    const tMotRes = document.getElementById('tabMotoresReserva'); if(tMotRes) tMotRes.onclick = ()=>{ salaMotoresTab='motoresReserva'; salaMotoresBusca=''; renderView(); };
    const tMotInst = document.getElementById('tabMotoresInstalados'); if(tMotInst) tMotInst.onclick = ()=>{ salaMotoresTab='motoresInstalados'; salaMotoresBusca=''; renderView(); };
    const tMotCons = document.getElementById('tabMotoresConserto'); if(tMotCons) tMotCons.onclick = ()=>{ salaMotoresTab='motoresConserto'; salaMotoresBusca=''; renderView(); };

    const buscaInput = document.getElementById('salaMotoresBuscaInput');
    if(buscaInput) buscaInput.oninput = ()=>{ salaMotoresBusca = buscaInput.value; renderView(); const el=document.getElementById('salaMotoresBuscaInput'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} };

    const newBtn = document.getElementById('newMotorBtn');
    if(newBtn) newBtn.onclick = ()=>{ editingMotor=null; motorFormDraft=null; pendingFotoMotorDataUrl=''; showMotorForm=true; renderView(); };

    document.querySelectorAll('.editMotorBtn').forEach(b=>{
      b.onclick = ()=>{ editingMotor = DB.ativosRG.find(r=>r.id===b.dataset.id); motorFormDraft=null; pendingFotoMotorDataUrl=''; showMotorForm=true; renderView(); };
    });

    document.querySelectorAll('.deleteMotorBtn').forEach(b=>{
      b.onclick = async ()=>{
        const motor = DB.ativosRG.find(r=>r.id===b.dataset.id);
        if(motor && motor.status==='instalado'){ toast('Este RG está instalado em um TAG. Movimente o motor antes de excluir.'); return; }
        if(!confirm('Excluir este motor definitivamente? O número de RG não será reutilizado.')) return;
        DB.ativosRG = DB.ativosRG.filter(r=>r.id!==b.dataset.id);
        await saveAll(KEYS.ativosRG, DB.ativosRG);
        toast('Motor excluído'); renderView();
      };
    });

    document.querySelectorAll('.motorStatusBtn').forEach(b=>{
      b.onclick = async ()=>{
        const motor = DB.ativosRG.find(r=>r.id===b.dataset.id);
        if(!motor) return;
        motor.status = b.dataset.status;
        await saveAll(KEYS.ativosRG, DB.ativosRG);
        toast('Status do motor atualizado para: ' + (STATUS_MOTOR[b.dataset.status]||b.dataset.status));
        renderView();
      };
    });

    document.querySelectorAll('.motorHistoricoBtn').forEach(b=>{
      b.onclick = ()=>{ motorHistoricoId=b.dataset.id; renderView(); };
    });
    const closeHistoricoBtn = document.getElementById('closeHistorico');
    if(closeHistoricoBtn) closeHistoricoBtn.onclick = ()=>{ motorHistoricoId=null; renderView(); };

    document.querySelectorAll('.motorEnviarConsertoBtn').forEach(b=>{
      b.onclick = ()=>{ motorConsertoEnvioId=b.dataset.id; renderView(); };
    });
    const closeConsertoEnvioBtn = document.getElementById('closeConsertoEnvio');
    if(closeConsertoEnvioBtn) closeConsertoEnvioBtn.onclick = ()=>{ motorConsertoEnvioId=null; renderView(); };
    const confirmConsertoEnvioBtn = document.getElementById('confirmConsertoEnvioBtn');
    if(confirmConsertoEnvioBtn) confirmConsertoEnvioBtn.onclick = async ()=>{
      const motor = DB.ativosRG.find(r=>r.id===motorConsertoEnvioId);
      if(!motor) return;
      const fornecedor = (document.getElementById('consertoFornecedor')||{}).value?.trim() || '';
      const nf = (document.getElementById('consertoNF')||{}).value?.trim() || '';
      const dataEnvio = (document.getElementById('consertoDataEnvio')||{}).value || new Date().toISOString().slice(0,10);
      if(!fornecedor){ toast('Preencha o fornecedor/oficina'); return; }
      if(!motor.consertos) motor.consertos = [];
      motor.consertos.push({id:uid(), fornecedor, nf, dataEnvio, dataRetorno:null, valor:null});
      motor.status = 'conserto';
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      motorConsertoEnvioId=null;
      toast('Motor enviado para conserto'); renderView();
    };

    document.querySelectorAll('.motorRegistrarRetornoBtn').forEach(b=>{
      b.onclick = ()=>{ motorConsertoRetornoId=b.dataset.id; renderView(); };
    });
    const closeConsertoRetornoBtn = document.getElementById('closeConsertoRetorno');
    if(closeConsertoRetornoBtn) closeConsertoRetornoBtn.onclick = ()=>{ motorConsertoRetornoId=null; renderView(); };

    const finalizarRetorno = async (novoStatus)=>{
      const motor = DB.ativosRG.find(r=>r.id===motorConsertoRetornoId);
      if(!motor) return;
      const valorInput = document.getElementById('consertoValorRetorno');
      const valor = valorInput && valorInput.value!=='' ? parseFloat(valorInput.value) : null;
      const orcamentoInput = document.getElementById('consertoOrcamentoRetorno');
      const orcamento = orcamentoInput ? orcamentoInput.value.trim() : '';
      const aberto = motorConsertoAberto(motor);
      if(aberto){ aberto.dataRetorno = new Date().toISOString().slice(0,10); aberto.valor = valor; aberto.orcamento = orcamento; }
      motor.status = novoStatus;
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      motorConsertoRetornoId=null;
      toast(novoStatus==='reserva' ? 'Motor retornou para a Sala de Motores' : 'Motor marcado como inativo (descarte)');
      renderView();
    };
    const confirmRetornoReservaBtn = document.getElementById('confirmRetornoReservaBtn');
    if(confirmRetornoReservaBtn) confirmRetornoReservaBtn.onclick = ()=>finalizarRetorno('reserva');
    const confirmRetornoDescarteBtn = document.getElementById('confirmRetornoDescarteBtn');
    if(confirmRetornoDescarteBtn) confirmRetornoDescarteBtn.onclick = ()=>finalizarRetorno('descarte');

    const closeMotorBtn = document.getElementById('closeMotorForm');
    if(closeMotorBtn) closeMotorBtn.onclick = ()=>{ showMotorForm=false; editingMotor=null; motorFormDraft=null; pendingFotoMotorDataUrl=''; renderView(); };

    document.querySelectorAll('.quickFillBtn').forEach(b=>{
      b.onclick = ()=>{ const f = document.getElementById(b.dataset.field); if(f) f.value = b.dataset.value; };
    });

    const fotoEl = document.getElementById('mFoto');
    if(fotoEl) fotoEl.onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxSize = 360;
          let w = img.width, h = img.height;
          if(w>h && w>maxSize){ h = h*(maxSize/w); w = maxSize; }
          else if(h>=w && h>maxSize){ w = w*(maxSize/h); h = maxSize; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          pendingFotoMotorDataUrl = canvas.toDataURL('image/jpeg', 0.7);
          captureMotorFormValues();
          renderView();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    const saveMotorBtn = document.getElementById('saveMotorBtn');
    if(saveMotorBtn) saveMotorBtn.onclick = async ()=>{
      captureMotorFormValues();
      const nome = motorFormDraft.nome;
      if(!nome){ toast('Preencha ao menos o nome do motor'); return; }
      const dados = {
        nome,
        fabricante: motorFormDraft.fabricante, modelo: motorFormDraft.modelo, numeroSerie: motorFormDraft.numeroSerie,
        placaIdentificacao: motorFormDraft.placaIdentificacao, localizacao: motorFormDraft.localizacao,
        observacoes: motorFormDraft.observacoes, campos: {...motorFormDraft.campos},
        foto: pendingFotoMotorDataUrl || (editingMotor ? editingMotor.foto : '') || ''
      };
      if(editingMotor){ Object.assign(editingMotor, dados); }
      else {
        DB.ativosRG.push({
          id:uid(), tipo:'Motor', descricaoOutros:'', numeroRG: proximoNumeroRGMotor(),
          status:'reserva', ativoId:null, historico:[], consertos:[],
          ...dados, dataCadastro:new Date().toISOString()
        });
      }
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      showMotorForm=false; editingMotor=null; motorFormDraft=null; pendingFotoMotorDataUrl='';
      toast('Motor salvo'); renderView();
    };

    document.querySelectorAll('.motorMoveBtn').forEach(b=>{
      b.onclick = ()=>{ motorMoveId=b.dataset.id; motorMoveDestino=''; renderView(); };
    });

    const closeMoveBtn = document.getElementById('closeMotorMove');
    if(closeMoveBtn) closeMoveBtn.onclick = ()=>{ motorMoveId=null; motorMoveDestino=''; renderView(); };

    const moveDestinoSel = document.getElementById('motorMoveDestino');
    if(moveDestinoSel) moveDestinoSel.onchange = ()=>{ motorMoveDestino = moveDestinoSel.value; };

    const confirmMoveBtn = document.getElementById('confirmMotorMoveBtn');
    if(confirmMoveBtn) confirmMoveBtn.onclick = async ()=>{
      const destinoId = (document.getElementById('motorMoveDestino')||{}).value;
      if(!destinoId){ toast('Selecione o ativo de destino'); return; }
      const destino = DB.ativos.find(a=>a.id===destinoId);
      if(!destino) return;
      if(destino.motorInstaladoId && !confirm('Este ativo já tem um motor instalado. Ao confirmar, o motor atual dele volta para a Sala de Motores com status "Aguardando decisão". Continuar?')) return;
      movimentarRGParaAtivo(motorMoveId, destino);
      await saveAll(KEYS.ativos, DB.ativos);
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      motorMoveId=null; motorMoveDestino='';
      toast('Motor movimentado'); renderView();
    };

    const tipoSel = document.getElementById('rgTipo');
    const outrosWrap = document.getElementById('rgOutrosWrap');
    if(tipoSel) tipoSel.onchange = ()=>{ if(outrosWrap) outrosWrap.classList.toggle('hidden', tipoSel.value!=='Outros'); };

    const addRGBtn = document.getElementById('addRGBtn');
    if(addRGBtn) addRGBtn.onclick = async ()=>{
      const tipo = document.getElementById('rgTipo').value;
      const descricaoOutros = document.getElementById('rgOutrosDescricao') ? document.getElementById('rgOutrosDescricao').value.trim() : '';
      const nome = document.getElementById('rgNome').value.trim();
      const localizacao = document.getElementById('rgLocalizacao').value.trim();
      if(!nome){ toast('Preencha o nome'); return; }
      const numeroRG = proximoNumeroRGEquipamento();
      DB.ativosRG.push({id:uid(), tipo, descricaoOutros, nome, numeroRG, localizacao:localizacao||'Sala de Motores', fabricante:'', modelo:'', numeroSerie:'', dataCadastro:new Date().toISOString()});
      await saveAll(KEYS.ativosRG, DB.ativosRG);
      toast('Adicionado à Sala de Motores com RG '+numeroRG); renderView();
    };

    document.querySelectorAll('.deleteRGBtn').forEach(b=>{
      b.onclick = async ()=>{
        const rg = DB.ativosRG.find(r=>r.id===b.dataset.id);
        if(rg && rg.status==='instalado'){ toast('Este RG está instalado em um TAG. Movimente o motor antes de excluir.'); return; }
        if(!confirm('Excluir este equipamento reserva definitivamente?')) return;
        DB.ativosRG = DB.ativosRG.filter(rg=>rg.id!==b.dataset.id);
        await saveAll(KEYS.ativosRG, DB.ativosRG);
        toast('Excluído'); renderView();
      };
    });

    const exportRGBtn = document.getElementById('exportRGBtn');
    if(exportRGBtn) exportRGBtn.onclick = exportSalaMotoresXlsx;
    return;
  }

  const importarBtn = document.getElementById('importarAtivosBtn');
  if(importarBtn) importarBtn.onclick = showImportAtivosFormatModal;

  const fileInput = document.getElementById('importAtivosFileInput');
  if(fileInput) fileInput.onchange = handleImportAtivosFile;

  const exportBtn = document.getElementById('exportAtivosBtn');
  if(exportBtn) exportBtn.onclick = ()=>{
    const incluirHierarquia = document.getElementById('incluirHierarquiaExportChk').checked;
    exportAtivosXlsx(incluirHierarquia);
  };
}

function exportSalaMotoresXlsx(){
  if(!window.XLSX){ toast('Biblioteca de planilhas não carregou.'); return; }

function handleImportAtivosFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!window.XLSX){ toast('Biblioteca de planilhas não carregou. Verifique sua conexão.'); return; }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      const dataRows = rows.slice(1).filter(r=>r && r[0] !== '' && r[0] !== undefined);
      if(dataRows.length===0){ toast('Nenhum dado encontrado na planilha'); return; }

      let novos=0, atualizados=0, ignorados=0;
      const paiPorCodigo = {}; // codigo do filho (lowercase) -> codigo do pai informado na planilha

      for(const row of dataRows){
        const codigo = String(row[0]||'').trim();
        const nome = String(row[1]||'').trim();
        const tipo = String(row[2]||'').trim();
        const fabricante = String(row[3]||'').trim();
        const modelo = String(row[4]||'').trim();
        const numeroSerie = String(row[5]||'').trim();
        const placaIdentificacao = String(row[6]||'').trim();
        const localizacao = String(row[7]||'').trim();
        const criticidade = String(row[8]||'').trim().toUpperCase();
        const codigoPai = String(row[9]||'').trim();
        if(!codigo || !nome) continue;
        if(codigoPai) paiPorCodigo[codigo.toLowerCase()] = codigoPai;

        const existente = DB.ativos.find(a=>a.codigo.toLowerCase()===codigo.toLowerCase());
        if(!existente){
          DB.ativos.push({id:uid(), codigo, nome, tipo, fabricante, modelo, numeroSerie, placaIdentificacao, localizacao, criticidade:(['A','B','C'].includes(criticidade)?criticidade:''), ativoPaiId:'', observacoes:'', foto:'', campos:{}, ativo:true, dataCadastro:new Date().toISOString()});
          novos++;
        } else {
          const msg = `O ativo "${codigo}" já existe:\n\nCadastro atual: ${existente.nome}\nNa planilha: ${nome}\n\nDeseja atualizar o cadastro com os dados da planilha?`;
          if(confirm(msg)){
            Object.assign(existente, {nome, tipo, fabricante, modelo, numeroSerie, placaIdentificacao, localizacao, criticidade:(['A','B','C'].includes(criticidade)?criticidade:existente.criticidade)});
            atualizados++;
          } else { ignorados++; }
        }
      }

      let vinculados = 0;
      Object.keys(paiPorCodigo).forEach(codFilhoLower=>{
        const filho = DB.ativos.find(a=>a.codigo.toLowerCase()===codFilhoLower);
        const pai = DB.ativos.find(a=>a.codigo.toLowerCase()===paiPorCodigo[codFilhoLower].toLowerCase());
        if(filho && pai && pai.id!==filho.id){ filho.ativoPaiId = pai.id; vinculados++; }
      });

      await saveAll(KEYS.ativos, DB.ativos);
      toast(`Importação concluída: ${novos} novos, ${atualizados} atualizados, ${ignorados} ignorados, ${vinculados} vínculos de hierarquia`);
      renderView();
    }catch(err){
      console.error(err);
      toast('Não foi possível ler a planilha. Verifique o formato do arquivo.');
    }
    e.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function exportAtivoPdf(ativoId){
  if(!window.jspdf){ toast('Biblioteca de PDF não carregou. Verifique sua conexão.'); return; }
  const ativo = DB.ativos.find(a=>a.id===ativoId);
  if(!ativo) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 16;

  doc.setFontSize(16); doc.text('ERTEL — Ficha Técnica do Equipamento', 14, y); y += 8;
  doc.setFontSize(10); doc.text('Gerado em: ' + new Date().toLocaleString('pt-BR'), 14, y); y += 8;
  doc.line(14, y, 196, y); y += 8;

  // Fotos
  try{
    if(ativo.foto){ doc.addImage(ativo.foto, 'JPEG', 14, y, 40, 40); }
    if(ativo.foto2){ doc.addImage(ativo.foto2, 'JPEG', 58, y, 40, 40); }
    if(ativo.foto || ativo.foto2) y += 44;
  }catch(e){ console.error('erro ao inserir foto no pdf', e); }

  doc.setFontSize(13); doc.text(`${ativo.codigo} — ${ativo.nome}`, 14, y); y += 8;
  doc.setFontSize(10);

  const linha = (label, valor)=>{
    if(!valor) return;
    if(y > 280){ doc.addPage(); y = 16; }
    doc.setFont(undefined,'bold'); doc.text(String(label)+':', 14, y);
    doc.setFont(undefined,'normal');
    const texto = doc.splitTextToSize(String(valor), 140);
    doc.text(texto, 55, y);
    y += 6*texto.length;
  };

  linha('Tipo', ativo.tipo);
  linha('Fabricante', ativo.fabricante);
  linha('Modelo', ativo.modelo);
  linha('Número de série', ativo.numeroSerie);
  linha('Placa de identificação', ativo.placaIdentificacao);
  linha('Localização', ativo.localizacao);
  linha('Criticidade', ativo.criticidade);
  const pai = ativo.ativoPaiId ? DB.ativos.find(x=>x.id===ativo.ativoPaiId) : null;
  if(pai) linha('Ativo pai', `${pai.codigo} — ${pai.nome}`);

  const especificos = (ativo.tipo && TIPO_CAMPOS_ESPECIFICOS[ativo.tipo]) ? TIPO_CAMPOS_ESPECIFICOS[ativo.tipo] : [];
  const campos = ativo.campos || {};
  if(especificos.some(f=>campos[f.id])){
    y += 2;
    if(y > 280){ doc.addPage(); y = 16; }
    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text('Dados técnicos', 14, y); doc.setFont(undefined,'normal'); doc.setFontSize(10); y += 7;
    especificos.forEach(f=>{ linha(f.label, campos[f.id]); });
  }

  linha('Observações', ativo.observacoes);

  const pecas = ativo.pecas || [];
  if(pecas.length>0){
    y += 4;
    if(y > 270){ doc.addPage(); y = 16; }
    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text('Peças cadastradas', 14, y); doc.setFont(undefined,'normal'); doc.setFontSize(9); y += 7;
    doc.text('Tipo', 14, y); doc.text('Descrição', 44, y); doc.text('Qtd', 110, y); doc.text('Cód. Fabr.', 125, y); doc.text('Status', 165, y);
    y += 4; doc.line(14, y, 196, y); y += 5;
    pecas.forEach(pc=>{
      if(y > 285){ doc.addPage(); y = 16; }
      doc.text(String(pc.tipoMaterial||'').slice(0,16), 14, y);
      doc.text(String(pc.descricao||'').slice(0,34), 44, y);
      doc.text(String(pc.quantidade||0), 110, y);
      doc.text(String(pc.codigoFabricante||'').slice(0,18), 125, y);
      doc.text(String(pc.statusEstoque||'').slice(0,16), 165, y);
      y += 6;
    });
  }

  doc.save(`ficha-tecnica-${ativo.codigo}.pdf`);
}

async function attachLoginEvents(){
  const doLogin = async (login, senha)=>{
    login = (login===undefined ? document.getElementById('loginUser').value : login).trim();
    senha = (senha===undefined ? document.getElementById('loginPass').value : senha).trim();
    const btn = document.getElementById('loginBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Entrando...'; }
    try{
      DB.usuarios = await loadAll(KEYS.usuarios, DB.usuarios);
    }catch(e){}
    if(btn){ btn.disabled = false; btn.textContent = 'Entrar'; }
    const u = DB.usuarios.find(x=>x.login===login && x.senha===senha && x.ativo!==false);
    if(!u){ const err=document.getElementById('loginError'); if(err) err.textContent = 'Login ou senha incorretos.'; return; }
    const remember = document.getElementById('rememberChk');
    try{
      if(remember && remember.checked) await window.storage.set('ertel:lastLogin', login, false);
      else await window.storage.delete('ertel:lastLogin', false);
    }catch(e){}
    currentUser = {id:u.id, nome:u.nome, perfil:u.perfil};
    try{ localStorage.setItem('ertel:session', u.id); }catch(e){}
    render();
  };
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn) loginBtn.onclick = ()=>doLogin();
  const passField = document.getElementById('loginPass');
  if(passField) passField.onkeydown = (e)=>{ if(e.key==='Enter') doLogin(); };

  const forgotBtn = document.getElementById('forgotBtn');
  if(forgotBtn) forgotBtn.onclick = ()=>toast('Fale com o administrador master para redefinir sua senha.');

  const qrBtn = document.getElementById('qrLoginBtn');
  if(qrBtn) qrBtn.onclick = ()=>{ loginScanning = true; renderLoginScanner(); };

  attachCommonEvents();

  try{
    const r = await window.storage.get('ertel:lastLogin', false);
    if(r && r.value){ const f=document.getElementById('loginUser'); if(f){ f.value = r.value; const chk=document.getElementById('rememberChk'); if(chk) chk.checked = true; } }
  }catch(e){}

  window._ertelDoLogin = doLogin;
}

function renderLoginScanner(){
  const holder = document.getElementById('loginScanHolder');
  if(!loginScanning){ holder.innerHTML=''; stopScanner(); return; }
  holder.innerHTML = `<div class="overlay" id="loginScanOverlay"><div class="sheet">

    <div class="qr-box"><video id="scanVideo" autoplay playsinline muted></video><div class="qr-frame"></div></div>
    <div class="note" id="scanStatus">Aponte a câmera para o QR Code de acesso fornecido pelo administrador.</div>
    <canvas id="scanCanvas" class="hidden"></canvas>
  </div></div>`;
  document.getElementById('closeLoginScan').onclick = ()=>{ loginScanning=false; renderLoginScanner(); };
  startLoginScanner();

async function startLoginScanner(){
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    const video = document.getElementById('scanVideo');
    video.srcObject = scanStream;
    const canvas = document.getElementById('scanCanvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    avisarSeJsQRNaoCarregou('scanStatus');
    const tick = ()=>{
      if(!loginScanning || !scanStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = window.jsQR ? jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'}) : null;
        if(code && code.data){
          const parts = code.data.split(':');
          if(parts.length===2){
            stopScanner(); loginScanning=false; renderLoginScanner();
            window._ertelDoLogin(parts[0], parts[1]);
            return;
          } else {
            const st = document.getElementById('scanStatus'); if(st) st.textContent = 'QR Code inválido para acesso.';
          }
        }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }catch(e){
    const st = document.getElementById('scanStatus');
    if(st) st.textContent = 'Não foi possível acessar a câmera.';
  }
}

function abcClassification(){
  const withValue = getProdutosArr().filter(p=>p.ativo!==false).map(p=>({...p, total:(p.quantidade||0)*(p.valorUnitario||0)}));
  withValue.sort((a,b)=>b.total-a.total);
  const grandTotal = withValue.reduce((s,p)=>s+p.total,0) || 1;
  let cum = 0;
  return withValue.map(p=>{
    cum += p.total;
    const pct = cum/grandTotal;
    const classe = pct<=0.8 ? 'A' : (pct<=0.95 ? 'B' : 'C');
    return {...p, classe};
  });
}

        <div class="desc">${p.descricao}</div>

      </div></div>`;
    });
  }

  html += `<h2 class="section-title">Top 5 — Mais Rotatividade</h2><div class="card">`;
  if(top5.length===0) html += `<div class="note">Ainda sem retiradas registradas.</div>`;
  top5.forEach((t,i)=>{ html += `<div style="display:flex;justify-content:space-between;padding:6px 0;${i>0?'border-top:1px solid var(--paper-2)':''}"><span>${i+1}. ${t.nome}</span><span class="qtd" style="font-family:var(--font-mono)">${t.qtd} un.</span></div>`; });
  html += `</div>`;

  html += `<h2 class="section-title">Classificação ABC</h2><div class="card">
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span><span class="pill A">A</span> Maior valor</span><span class="qtd" style="font-family:var(--font-mono)">${abcCount.A} produtos</span></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--paper-2)"><span><span class="pill B">B</span> Valor médio</span><span class="qtd" style="font-family:var(--font-mono)">${abcCount.B} produtos</span></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--paper-2)"><span><span class="pill C">C</span> Menor valor</span><span class="qtd" style="font-family:var(--font-mono)">${abcCount.C} produtos</span></div>
  </div>`;

  if(centrosRank.length>0){
    html += `<h2 class="section-title">Consumo por Centro de Custo (mês)</h2><div class="card">`;
    centrosRank.forEach((c,i)=>{ html += `<div style="display:flex;justify-content:space-between;padding:6px 0;${i>0?'border-top:1px solid var(--paper-2)':''}"><span>${c.nome}</span><span style="font-family:var(--font-mono)">${money(c.val)}</span></div>`; });
    html += `</div>`;
  }

  return html;
}

/* ============ PRODUTOS ============ */
let produtoSearch = '';
let editingProduto = null;
let showProdutoForm = false;
let pendingFotoDataUrl = '';
let mostrarInativosProdutos = false;

function produtosView(){

            <span class="codigo">${p.codigo}</span>

        </div>

        <div class="meta"><span>Mín: ${p.estoqueMinimo}</span>${isAdmin?`<span>${money(p.valorUnitario)}/un · Total: ${money((p.quantidade||0)*(p.valorUnitario||0))}</span>`:'<span></span>'}</div>
        ${p.endereco?`<div class="meta" style="margin-top:2px"><span>📍 ${p.endereco}</span><span></span></div>`:''}

function produtoFormSheet(){

  const unidades = moduloAtivo==='lub' ? ['kg','litro','ml'] : ['peça','metro','litro','kg','caixa','par','rolo','conjunto'];
  const tiposLubrificante = ['Graxa','Graxa Spray','Óleo','Óleo Spray'];
  return `
  <div class="overlay" id="prodOverlay"><div class="sheet">
    <div class="sheet-head"><h2 class="section-title" style="margin:0">${editingProduto?(moduloAtivo==='lub'?'Editar Lubrificante':'Editar Produto'):(moduloAtivo==='lub'?'Novo Lubrificante':'Novo Produto')}</h2><button class="close" id="closeProdForm">×</button></div>

    <label>Foto do produto</label>
    <div style="display:flex;align-items:center;gap:12px">
      ${fotoAtual?`<img src="${fotoAtual}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`:`<div style="width:56px;height:56px;border-radius:8px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--muted)">${ICONS.camera}</div>`}
      <input type="file" accept="image/*" id="fFoto" style="flex:1">
    </div>

    <label>Código do produto</label>
    <input id="fCodigo" value="${p.codigo}" placeholder="Ex: PF1234">
    <label>Descrição</label>
    <input id="fDescricao" value="${p.descricao}" placeholder="Ex: Parafuso M8 sextavado">
    ${moduloAtivo==='lub'?`<label>Tipo de lubrificante</label>
    <select id="fTipoLub"><option value="">Selecione...</option>${tiposLubrificante.map(t=>`<option value="${t}" ${p.tipoLubrificante===t?'selected':''}>${t}</option>`).join('')}</select>`:''}
    <label>Endereço (localização física)</label>
    <input id="fEndereco" value="${p.endereco||''}" placeholder="Ex: Corredor 3, Prateleira B2">
    <div class="row-2">
      <div><label>Quantidade</label><input id="fQuantidade" type="number" value="${p.quantidade}"></div>
      <div><label>Unidade</label><select id="fUnidade">${unidades.map(u=>`<option value="${u}" ${(p.unidade||unidades[0])===u?'selected':''}>${u}</option>`).join('')}</select></div>
    </div>
    <label>Valor unitário (R$)</label>
    <input id="fValor" type="number" step="0.01" value="${p.valorUnitario}">
    <label>Estoque mínimo (alerta de recompra)</label>
    <input id="fMinimo" type="number" value="${p.estoqueMinimo}">

    ${editingProduto?`<button class="btn btn-danger" id="deactivateProdBtn">${editingProduto.ativo===false?'Reativar produto':'Desativar produto'}</button>
    <button class="btn btn-ghost" id="deleteProdBtn" style="border-color:var(--brick);color:var(--brick)">Excluir produto definitivamente</button>`:''}
